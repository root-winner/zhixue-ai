# 在 GitHub 云端构建并推送到华为云 SWR（避开本机网络）
name: Build and Push to Huawei SWR

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "requirements.docker.txt"
      - "app/**"
      - "config.py"
      - ".github/workflows/build-push-swr.yml"

env:
  SWR_REGISTRY: swr.cn-north-4.myhuaweicloud.com
  IMAGE_NAME: zhixue-ai/backend

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Huawei SWR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.SWR_REGISTRY }}
          username: ${{ secrets.SWR_USERNAME }}
          password: ${{ secrets.SWR_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.SWR_REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.SWR_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
