# ============================================
# 智学AI - Docker Compose 编排文件
# 一键启动: docker-compose up -d
# 查看日志: docker-compose logs -f
# 停止:     docker-compose down
# ============================================

services:
  # --- 后端 API 服务 ---
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zhixue-ai-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # 向量数据库持久化
      - ./chroma_db:/app/chroma_db
      # 知识库文档持久化
      - ./data:/app/data
      # 日志持久化
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # --- 前端 Streamlit 服务 ---
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: zhixue-ai-frontend
    ports:
      - "8501:8501"
    environment:
      # 前端通过容器网络访问后端
      - API_BASE=http://backend:8000/api
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
