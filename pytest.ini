# pytest 配置文件
[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto

# 命令行参数
addopts = -v --tb=short --strict-markers -m "not integration"

# 自定义标记
markers =
    unit: 单元测试 (不依赖外部服务)
    integration: 集成测试 (需要真实 LLM / 向量库, 默认不运行)
    slow: 耗时测试
